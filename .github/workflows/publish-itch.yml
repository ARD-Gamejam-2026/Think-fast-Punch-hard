name: Publish to itch.io

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A newer tag supersedes any in-flight publish of an older one.
concurrency:
  group: publish-itch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A job targeting an offline self-hosted runner queues for up to 24h
  # instead of failing over, so this probe routes explicitly. Reading
  # runner status needs a PAT with Administration:read (RUNNER_CHECK_TOKEN);
  # without one the probe falls back to the GitHub-hosted path.
  choose-runner:
    name: Choose runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      mac-online: ${{ steps.probe.outputs.mac-online }}
    steps:
      - name: Probe self-hosted runner status
        id: probe
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          status=$(gh api repos/${{ github.repository }}/actions/runners \
            --jq '.runners[] | select(.name == "mbruckner-m4max") | .status' 2>/dev/null || echo "unknown")
          echo "Runner status: $status"
          if [ "$status" = "online" ]; then
            echo "mac-online=true" >> "$GITHUB_OUTPUT"
          else
            echo "mac-online=false" >> "$GITHUB_OUTPUT"
          fi

  build-mac:
    name: Build WebGL (Mac)
    needs: choose-runner
    if: needs.choose-runner.outputs.mac-online == 'true'
    runs-on: [self-hosted, macOS, unity]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WebGL
        run: |
          rm -rf build
          "/Applications/Unity/Hub/Editor/6000.5.9f1/Unity.app/Contents/MacOS/Unity" \
            -batchmode -quit -projectPath . \
            -buildTarget WebGL \
            -executeMethod CIBuild.BuildWebGL \
            -logFile -

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL build
          path: build/WebGL/WebGL
          retention-days: 3

  build-hosted:
    name: Build WebGL (GitHub-hosted fallback)
    needs: choose-runner
    if: needs.choose-runner.outputs.mac-online != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Unity WebGL editor image (~15 GB unpacked) does not fit in the
      # free space of a stock runner; drop preinstalled toolchains we don't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL build
          path: build/WebGL/WebGL
          retention-days: 3

  publish:
    name: Publish to itch.io
    needs:
      - build-mac
      - build-hosted
    # Exactly one build job runs; publish when that one succeeded.
    if: >-
      !cancelled() &&
      (needs.build-mac.result == 'success' || needs.build-hosted.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: WebGL build
          path: build/WebGL/WebGL

      - name: Publish to itch.io
        uses: KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: build/WebGL/WebGL
          itchUsername: rhinocerosgamesproduction
          itchGameId: think-fast-punch-hard
          buildChannel: html5
          buildNumber: ${{ github.ref_name }}

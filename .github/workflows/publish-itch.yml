name: Publish to itch.io

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A newer tag supersedes any in-flight publish of an older one.
concurrency:
  group: publish-itch
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build WebGL and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Unity WebGL editor image (~15 GB unpacked) does not fit in the
      # free space of a stock runner; drop preinstalled toolchains we don't use.
      # Do NOT run `docker image prune` here: GitHub pre-builds the image for
      # the Docker-based itch-publish action at job setup, and pruning deletes
      # it, breaking the publish step (only ~1.8 GB reclaimed anyway).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # Restore/save are split so the cache is saved right after the build:
      # the plain actions/cache post step only saves on job success, so a
      # publish failure would discard the ~1h Library import.
      - name: Restore Library cache
        id: restore-library
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL

      - name: Save Library cache
        if: steps.restore-library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Publish to itch.io
        uses: KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: build/WebGL/WebGL
          itchUsername: rhinocerosgamesproduction
          itchGameId: think-fast-punch-hard
          buildChannel: html5
          buildNumber: ${{ github.ref_name }}

name: Publish to itch.io

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A newer tag supersedes any in-flight publish of an older one.
concurrency:
  group: publish-itch
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build WebGL and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Unity WebGL editor image (~15 GB unpacked) does not fit in the
      # free space of a stock runner; drop preinstalled toolchains we don't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL

      - name: Publish to itch.io
        uses: KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: build/WebGL/WebGL
          itchUsername: rhinocerosgamesproduction
          itchGameId: think-fast-punch-hard
          buildChannel: html5
          buildNumber: ${{ github.ref_name }}

name: Publish to itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes any in-flight publish of an older commit.
concurrency:
  group: publish-itch
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build WebGL and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL

      - name: Publish to itch.io
        uses: KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: build/WebGL/WebGL
          itchUsername: rhinocerosgamesproduction
          itchGameId: think-fast-punch-hard
          buildChannel: html5
          buildNumber: ${{ github.run_number }}
